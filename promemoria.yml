name: Promemoria scadenze

on:
  schedule:
    - cron: "0 6 * * *"        # ogni mattina alle 6:00 UTC (7:00 o 8:00 in Italia)
  workflow_dispatch:
    inputs:
      prova:
        description: "Invia solo un messaggio di prova"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  invia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invia i promemoria
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
        run: python promemoria.py ${{ inputs.prova && '--prova' || '' }}
